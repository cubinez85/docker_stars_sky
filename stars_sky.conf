# /etc/nginx/sites-available/stars_sky
# Nginx configuration for Stars Sky project
# Nginx слушает порт 80 и проксирует на Gunicorn (порт 8083)

upstream stars_sky_backend {
    server 127.0.0.1:8083;
}

server {
    listen 80;
    server_name stars-sky.cubinez.ru www.stars-sky.cubinez.ru;

    # Логи
    access_log /var/log/nginx/stars_sky_access.log;
    error_log  /var/log/nginx/stars_sky_error.log;

    # Максимальный размер загружаемых файлов
    client_max_body_size 10M;

    # Статические файлы Django
    location /static/ {
        alias /home/cubinez85/stars_sky/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Медиа файлы
    location /media/ {
        alias /home/cubinez85/stars_sky/media/;
        expires 7d;
    }

    # Проксирование на Gunicorn
    location / {
        proxy_pass http://stars_sky_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # Таймауты
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://stars_sky_backend;
        access_log off;
    }
}
